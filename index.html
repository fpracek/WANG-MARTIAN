:root{--bg:#050a06;--fg:#7dff8a;--dim:#2f7a3a;--btn:#0e1f12}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}

#pad .row{display:flex;gap:8px;justify-content:center}
#pad button{flex:1;max-width:110px;min-height:52px;font:600 18px ui-monospace,Consolas,monospace;background:var(--btn);color:var(--fg);border:1px solid var(--dim);border-radius:10px}
#pad button:active{background:var(--dim);color:#000}
#pad .fire{flex:2;max-width:200px;border-color:var(--fg)}
@media (hover:none),(pointer:coarse){#pad{display:flex}}
#hint{font-size:12px;color:var(--dim);text-align:center;padding-bottom:8px}
@media (hover:none),(pointer:coarse){#hint{display:none}}
</style>

class Terminal {
  constructor(){

  clear(){ this.ch.fill(0x20); this.fl.fill(0); this.box.fill(0); this.cx=0; this.cy=0; this.dirty=true; }
  out(b){
    if(this.seq.length){ this.seqByte(b); return; }
    switch(b){
      case 0x02: this.seq=[2]; return;
      case 0x0D: this.temp=false; this.cx=0; return;
      case 0x0E: this.on=false; this.temp=true; return;
      case 0x0F: this.on=false; this.temp=false; return;

      case 0x05: case 0x06: case 0x00: case 0x04: case 0x0B: return;   // cursore: non disegnato

      case 0x09: if(this.cx<COLS-1) this.cx++; return;
      case 0x0A: this.cy=Math.min(ROWS-1,this.cy+1); return;
      case 0x0C: this.cy=Math.max(0,this.cy-1); return;

  drawBox(r,c,h,w,draw){

const glyphCache=new Map();
function glyphRows(ch,alt,under){
  const key=ch|(alt?128:0)|(under?256:0);
  let g=glyphCache.get(key); if(g) return g;
  const t=alt?FONT_A:FONT_N, block=alt&&ch>=0x40; g=new Array(11);

    let p;

    else p = (r<2||r>=10) ? 0 : t[8*ch+r-2];
    p<<=1;
    if(block) p |= ((p<<2)&0x200)|((p>>2)&1);   // i blocchi riempiono la cella (come l'hardware)
    if(under&&ch>=0x10&&r===10) p=0x55<<1;
    g[r]=p;
  }
  glyphCache.set(key,g); return g;
}

  at(0,30); hex('020404040E'); txt('MARTIAN WAR');
  at(2,5); hex('0F'); txt('THERE IS ONE WEAPON REMAINING ON EARTH.');
  at(4,5); txt('THIS WEAPON IS CONTROLLED WITH THE FOLLOWING KEYS;');
  at(5,20); txt('4  - MOVE TO LEFT'); at(6,20); txt('5  - STOP');
  at(7,20); txt('6  - MOVE TO RIGHT'); at(8,20); txt('8  - FIRE A MISSILE');
  at(10,5); txt('THERE WILL BE MARTIAN SPACESHIPS FLYING ALL OVER THE PLACE AND DROPPING');
  at(11,10); txt('BOMBS DOWN ON YOU AND THE HUMAN POPULATION.');
  at(13,5); txt('YOUR MISSION IS QUITE SIMPLE. THERE ARE A LIMITED NUMBER OF MARTIAN');
  at(14,10); txt('SHIPS AND IF YOU DESTROY ALL OF THEM BEFORE THEY DESTROY THE WHOLE');
  at(15,10); txt('POPULATION OF EARTH THEN YOU WIN.');
  at(17,5); txt('IF YOUR WEAPON IS HIT IT WILL HAVE TO BE REPAIRED AND THEREFORE');
  at(18,10); txt('WILL BE UNUSABLE FOR A PERIOD OF TIME.');
  at(20,5); txt("HIT 'RETURN' TO CONTINUE");
  await lineInput(64);
}
async function levelSelect(){
  hex('0D0306'); at(0,30); hex('020404040E'); txt('MARTIAN WAR'); hex('0F');
  at(7,5); txt('WHAT LEVEL OF PLAY WOULD YOU LIKE (1 - 3)');
  at(9,10); txt('1  -  BEGINNER'); at(10,10); txt('2  -  INTERMEDIATE'); at(11,10); txt('3  -  ADVANCED');
  at(7,47); txt('?');
  const v=parseFloat(await lineInput(10)); if(!isNaN(v)) q=v;
  if(q<1||q>3) q=1;
  at(15,5); txt("IF YOU WANT SOUND EFFECTS THEN TYPE 'Y' ?");
  sS=(await lineInput(1)); if(sS!=='Y') sS='N';     // S$ è dimensionata a 1 carattere
}
function initVars(){   // 300-500
  hex('0D03060202020F');
  for(let a=1;a<=4;a++){ A[a]=B[a]=C[a]=C1a[a]=0; if(B1[a]===undefined){B1[a]=C2[a]=A1[a]=A2[a]=Hh[a]=0;} }
  for(let a=1;a<=5;a++){ D[a]=E[a]=F[a]=0; if(D1[a]===undefined) D1[a]=D2[a]=0; }
  for(let a=1;a<=14;a++) Yd[a]=0;
  for(let a=0;a<=80;a++) if(M[a]===undefined) M[a]=0;
  for(i=4;i<=73;i++) M[i]=1;
  i=3; for(;;){ M[i]=2; if(i<69) M[i+1]=3; if(i>69) break; i = (i===1)? i+4 : i+5; }
  m1=14; t1=25;
  for(let a=1;a<=4;a++){ C[a]=C1a[a]=1; A[a]=1; }
  for(let a=1;a<=5;a++) F[a]=1;
  kS=tS='5'; n=-1; c=0; l=0;
  for(let a=1;a<=4;a++) H1[a]=-1;
  k=6; for(let a=1;a<=14;a++){ P[a]=k; k+=5; }
}
function drawField(){   // 520-580
  at(0,0); T.drawBox(0,0,24,79,true);
  T.drawBox(0,62,3,17,true);
  T.drawBox(0,62,0,17,false);   // BOX(-0,-17)
  T.drawBox(0,79,3,0,false);    // BOX(-3,-0)
  at(0,65); hex('020402040E'); txt('MARTIAN WAR'); hex('0F');
  at(1,64); txt('MARTIANS -'); num3(t1);
  at(2,64); txt('HUMANS   -'); num3(m1);
}
async function humansRun(){   // 600-910
  const data=[11,12,10,10,8,9,6,7,5,5,3,4,1,2], L={1:3,3:1,5:2,7:3,9:1,11:2,13:3}, R={2:74,4:73,6:75,8:74,10:73,12:75};
  j1=-1; let skip=false;   // un tasto durante l'intro la salta
  for(i=1;i<=14;i++){
    m=data[i-1]; j1=-j1;
    y = j1===1 ? L[i] : (R[i]||74);
    for(j=1;j<=m;j++){
      const ids = j1===-1 ? ['41','42','43','44','45','40'] : ['31','32','33','34','35','30'];
      for(const id of ids){ spr(id,y); if(!skip){ await frame(); if(keyq.length){ skip=true; keyq.length=0; } } }   // i 6 disegni formano la corsa: vanno visti in sequenza
      if(j1===1) y+=3; else if(j!==m) y-=3;
    }
    // l'uomo fermo cade in 5k (come il ridisegno finale), non in 5k+1: altrimenti restano due sagome sovrapposte
    spr('50',y-1); if(!skip) await sleep(60); spr('51',y-2); if(!skip) await sleep(60);
    spr('200',y-1); clr(21,y-1,1); clr(22,y-2,1);   // cancella i residui di '50/'51
  }
}

/* --- sottoprogrammi (numeri = righe BASIC originali) --- */
function s2050(){   // muove il missile dell'utente
  if(!(n>=0)){ at(1,64); txt('M'); return; }
  n-=2; clr(n+2,m,1);
  if(n<0) return;
  if(m>61&&n<3){ n=-2; return; }
  for(i=1;i<=4;i++){
    if(n!==A[i]&&n+1!==A[i]) continue;
    if(B[i]===0) continue;
    if(m>=B[i]&&m<B[i]+6){ // 2330 colpito un marziano
      n=-2; B1[i]=B[i]; C2[i]=3; ding_(); B[i]=-1; t1--;
      at(1,74); num3(t1);
      if(t1===0) throw new GameOver(true);
      return;
    }
  }
  for(i=1;;i++){
    if(D[i]>0 && (n===D[i]||n+1===D[i]) && m===E[i]){
      D1[i]=D[i]; ding_(); D[i]=-1; D2[i]=2; n=-2; return;
    }
    if(i===5) break;
  }
  at(n,m); hex(hx(2300,0));
}
function s3130(){   // un marziano sgancia una bomba
  j=1;
  for(;;){ if(D[j]===0) break; if(j===5) return; j++; }
  if(n===A[i]+1 && m===B[i]+3) return;
  D[j]=A[i]+1; E[j]=B[i]+3; at(D[j],E[j]); hex('FF');
}
function s3030(){   // ritorna true se il marziano è stato colpito (RETURN CLEAR)
  if(m>B[i]&&m<B[i]+6){ B1[i]=B[i]; C2[i]=3; ding_(); B[i]=-1; n=-2; return true; }
  return false;
}
function s2400(){
  r1=Math.floor(rnd()*20);
  if(r1===10){
    j=0; for(i=1;i<=4;i++) if(B[i]!==0) j++;
    if(j<t1){
      let found=false;
      for(i=1;;i++){ if(B[i]<=0&&B1[i]===0){found=true;break;} if(i===4) break; }
      if(found){
        for(;;){
          r=Math.floor(rnd()*15); let again=false;
          for(j=1;j<=4;j++) if(B[j]!==0&&A[j]===r){again=true;break;}
          if(!again) break;
        }
        A[i]=r; r2=Math.floor(rnd()*4);
        B[i]= r2<2?1 : (A[i]<3?56:70);
        C1a[i]= r2<2?1:-1;
        A1[i]=Math.floor(rnd()*4)+1; A2[i]=Math.floor(rnd()*4)+1;
      }
    }
  }
  for(i=1;i<=4;i++){
    if(!(B[i]>0)){ at(1,64); txt('MARTIAN'); continue; }
    if(A1[i]<=1){ C[i]=C[i]*-1; if(C[i]===-1){ at(1,64); txt('MARTIAN'); continue; } }
    if(A1[i]<=2 && (B[i]===15||B[i]===30||B[i]===45||B[i]===60)){ r=Math.floor(rnd()*25); if(r<10) C1a[i]=-C1a[i]; }
    if(A1[i]===3){ if(B[i]<y-4) C1a[i]=1; else if(B[i]>y+11) C1a[i]=-1; }
    B[i]+=C1a[i];
    if(B[i]>72||B[i]<1||(A[i]<3&&B[i]>56)){ clr(A[i],B[i],7); B[i]=0; continue; }   // 3090
    r=Math.floor(rnd()*40);
    if(r<q&&A1[i]<3) s3130();
    if(A1[i]===3 && B[i]-4<y && y<B[i]+11 && r<q*6) s3130();
    if(A1[i]===4){
      for(k=1;k<=14;k++) if(P[k]===B[i]+3){ if(r<q*12) s3130(); break; }
    }
    if(A[i]===n && s3030()) continue;
    const a2=A2[i]; at(A[i],B[i]);
    if(a2===1){ C2[i]=(C2[i]+1)%4; hex(hx(2990, (C2[i]===3||C2[i]===1)?0 : C2[i]===2?1:2)); }
    else if(a2===2){ C2[i]=(C2[i]+1)%2; hex(hx(2950, C2[i]===1?0:1)); }
    else if(a2===3){ C2[i]=(C2[i]+1)%2; hex(hx(2910, C2[i]===1?0:1)); }
    else { C2[i]=(C2[i]+1)%2; hex(hx(2870, C2[i]===1?0:1)); }
  }
}
function drawBomb(){ at(D[i],E[i]); hex('FF'); }
function s3240(){   // missili dei marziani
  for(i=1;i<=5;i++){
    if(!(D[i]>0)){ at(1,64); txt('M'); continue; }
    F[i]=F[i]*-1;
    if(!(F[i]!==-1)){ at(1,64); txt('M'); continue; }
    clr(D[i],E[i],1); D[i]++;
    if(D[i]===n && m===E[i]){ D1[i]=D[i]; D[i]=-1; ding_(); D2[i]=2; n=-2; continue; }
    if(D[i]===20&&c===0){
      if(E[i]>=y+1&&E[i]<=y+5){ ding_(); y1=y; y=0; c=50; D[i]=0; } else drawBomb();
      continue;
    }
    if(D[i]===24){ D[i]=0; continue; }
    if(D[i]!==21){ drawBomb(); continue; }
    // 3360: la bomba tocca terra
    j=E[i]; c1=0;
    if(M[j]===2||M[j]===3||M[j]===0){ drawBomb(); continue; }
    for(;;){ j--; if(j<1||M[j]===3) break; if(M[j]===1) c1=1; M[j]=0; }
    M[j]=2; t=j;
    for(;;){ j++; if(j>80||M[j]===2) break; if(M[j]===1) c1=1; M[j]=0; }
    if(c1!==0){
      m1--;
      for(k=1;k<=14&&P[k]!==t+2;k++);
      if(k<=14) P[k]=0;
      l++;
      at(2,74); num3(m1);
      for(k=1;k<=4&&H1[k]>-1;k++);
      if(k<=4){ H1[k]=3; Hh[k]=t; }
    }
    if(m1===0) throw new GameOver(false);
    D[i]=0;
  }
}
function s3760(){   // marziani che esplodono
  for(i=1;i<=4;i++){
    if(B[i]>=0||C2[i]===-1) continue;
    if(C2[i]>=1&&C2[i]<=3){ at(A[i],B1[i]); hex(hx(3800,3-C2[i])); } else clr(A[i],B1[i],7);
    if(C2[i]===0){ B1[i]=0; B[i]=0; }
    C2[i]--;
  }
}
function s3850(){   // umani che esplodono
  if(l===0) return;
  for(i=1;i<=4;i++){
    H1[i]--;
    if(H1[i]>-1){ spr(H1[i]===3?'23':H1[i]===2?'22':H1[i]===1?'21':'20', Hh[i]); }
    else if(H1[i]===-1) l--;
  }
}
function s4110(){   // missili che esplodono
  for(i=1;i<=5;i++){
    if(D[i]>=0) continue;
    if(D2[i]===2){ at(D1[i],E[i]); hex(hx(4130,0)); }
    else if(D2[i]===1){ at(D1[i],E[i]); hex(hx(4130,1)); }
    else clr(D1[i],E[i],1);
    if(D2[i]===0) D[i]=0;
    D2[i]--;
  }
}
function s4180(){   // cannone che esplode
  if(c<40) return;
  if(c===40){ clr(19,y1,7); clr(20,y1,7); return; }
  spr('L'+(4210+(50-c)*10), y1);
}
async function s1980(){ if(!(n>=0)){ n=18; m=y+3; at(n,m); hex(hx(2010,0)); } kS=tS; }
async function settle(){   // 4330/5060: pulisce le esplosioni
  for(let a=0;a<5;a++){ s3850(); s3760(); s4110(); s4180(); await sleep(90); }
  for(let a=0;a<3;a++){ s4180(); await sleep(90); }
}

/* --- ciclo principale (1740-1950) --- */
async function mainLoop(){
  y=35; hex('020402000F');
  let last=performance.now();
  for(;;){
    const wait=last+TICK-performance.now(); if(wait>0) await sleep(wait); last=performance.now();
    if(document.hidden){ await frame(); continue; }
    s4110(); s3850(); s2050(); s2400(); s3760(); s2050(); s4180(); s3240(); s2050();
    if(c!==0){ at(1,64); txt('MARTIAN'); c--; if(c===0) y=35; continue; }
    keyIn();
    if(kS==='8') await s1980();
    for(;;){
      if(kS==='4') y--; else if(kS==='6') y++;
      tS=kS;
      if(y<0){ kS='6'; continue; }
      if(y>72){ kS='4'; continue; }
      break;
    }
    at(20,y); hex(hx(1910,0));
  }
}
async function winScreen(){   // 4320
  await settle();
  clr(20,y,7); j9=1;
  hex('020404040E');
  at(4,30); txt('CONGRATULATIONS');
  at(5,20); txt('YOU HAVE SAVED EARTH FROM THE MARTIAN ATTACK!!');
  at(7,20); txt('AND THE PEOPLE OF THE EARTH ARE JUMPING FOR JOY!!');
  at(9,20); txt("HIT 'RETURN' TO PLAY AGAIN"); hex('0F');
  j=0; for(let a=1;a<=79;a++) if(M[a]===3){ j++; Yd[j]=a; }
  for(;;){
    keyIn(); if(kS==='\r') return;
    if(j>0){
      const who=Yd[(Math.floor(rnd()*20)%j)+1];
      for(const id of ['100','101','102','103','104','105','106','105','104','103','102','101','100']){ spr(id,who); await sleep(30); }
      ding_();
    } else await sleep(100);
  }
}
async function loseScreen(){   // 5050
  await settle(); j9=1;
  for(;;){
    keyIn(); if(kS==='\r') return;
    const X=Math.floor(rnd()*23), Y=Math.floor(rnd()*76), q1=Math.floor(rnd()*6);
    at(X,Y);
    if(q1<4) hex(hx(5130,q1)); else hex(hx(5140,q1-4));
    hex('020400020E');
    at(4,30); txt('SORRY CHUMP');
    at(5,10); txt('THE MARTIANS HAVE SUCCESSFULLY DESTROYED ALL LIFE ON EARTH!');
    at(8,20); txt("HIT 'RETURN' TO PLAY AGAIN"); hex('0F06');
    await sleep(60);
  }
}
async function run(){
  for(;;){
    try{
      T.clear(); j9=0; q=0; keyq.length=0;
      await instructions();
      for(;;){
        await levelSelect();
        initVars(); drawField();
        if(j9!==1) await humansRun();
        for(let a=5;a<=70;a+=5) spr('200',a);
        try{ await mainLoop(); }
        catch(e){ if(!(e instanceof GameOver)) throw e; if(e.win) await winScreen(); else await loseScreen(); }
      }
    }catch(e){ if(!(e instanceof Quit)) throw e; }
  }
}

/* ================= avvio ================= */
let blinkOn=true, lastBlink=true;
function loop(ts){
  blinkOn=Math.floor(ts/450)%2===0;
  if(T.dirty||blinkOn!==lastBlink){ T.dirty=false; lastBlink=blinkOn; render(T,blinkOn); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
run();
</script>
